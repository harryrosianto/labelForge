[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelforge"
version = "0.1.0"
description = "Web platform auto-labeling dataset untuk AI vision"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "opencv-python-headless>=4.10",  # video/RTSP & augmentasi (Apache 2.0)
    "pyyaml>=6",  # data.yaml saat import YOLO
    "cryptography>=42",  # enkripsi URL kamera RTSP
]

[project.optional-dependencies]
# Hanya dibutuhkan worker / inference server / CLI. Versi transformers di-pin karena
# API post-processing Grounding DINO & OWLv2 berubah antar versi.
# Torch CPU: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers==5.19.0",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["labelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
